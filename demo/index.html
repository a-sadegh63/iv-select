<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IvSelect - دمو با سیستم تم</title>
</head>
<body>
    <h2>🎯 IvSelect - سیستم تم ماژولار</h2>
    
    <!-- نمونه‌های مختلف -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
        
        <div>
            <h3>تم روشن (پیش‌فرض)</h3>
            <select id="demo-light">
                <option value="1">گزینه اول</option>
                <option value="2">گزینه دوم</option>
                <option value="3">گزینه سوم</option>
            </select>
        </div>

        <div>
            <h3>تم تیره</h3>
            <select id="demo-dark">
                <option value="1">گزینه اول</option>
                <option value="2">گزینه دوم</option>
                <option value="3">گزینه سوم</option>
            </select>
        </div>

        <div>
            <h3>تم مدرن</h3>
            <select id="demo-modern">
                <option value="1">گزینه اول</option>
                <option value="2">گزینه دوم</option>
                <option value="3">گزینه سوم</option>
            </select>
        </div>

        <div>
            <h3>تم اقیانوس</h3>
            <select id="demo-ocean">
                <option value="1">گزینه اول</option>
                <option value="2">گزینه دوم</option>
                <option value="3">گزینه سوم</option>
            </select>
        </div>

        <div>
            <h3>تم نیمه‌شب</h3>
            <select id="demo-midnight">
                <option value="1">گزینه اول</option>
                <option value="2">گزینه دوم</option>
                <option value="3">گزینه سوم</option>
            </select>
        </div>

        <div>
            <h3>تم جنگل</h3>
            <select id="demo-forest">
                <option value="1">گزینه اول</option>
                <option value="2">گزینه دوم</option>
                <option value="3">گزینه سوم</option>
            </select>
        </div>

    </div>

    <!-- بخش اطلاعات -->
    <div style="margin-top: 40px; padding: 20px; background: #f8fafc; border-radius: 8px;">
        <h3>📊 تم‌های موجود:</h3>
        <pre id="theme-list" style="background: #fff; padding: 15px; border-radius: 4px;"></pre>
    </div>

    <!-- بارگذاری اسکریپت‌ها -->
    <script type="module">
        // اول تم‌ها رو لود کن
        import IvSelectThemeManager from '../iv-select.themes.js';
        import IvSelect from '../iv-select.js';
        
        // نمایش لیست تم‌ها
        document.getElementById('theme-list').textContent = 
            JSON.stringify(IvSelectThemeManager.listThemes(), null, 2);
        
        // مقداردهی اولیه با تم‌های مختلف
        const instances = {
            light: new IvSelect(document.querySelector('#demo-light'), {
                theme: 'light',
                placeholder: 'تم روشن...',
                themeManager: IvSelectThemeManager,
				searchable: true
            }),
            
            dark: new IvSelect(document.querySelector('#demo-dark'), {
                theme: 'dark',
                placeholder: 'تم تیره...',
                themeManager: IvSelectThemeManager
            }),
            
            modern: new IvSelect(document.querySelector('#demo-modern'), {
                theme: 'modern',
                placeholder: 'تم مدرن...',
                themeManager: IvSelectThemeManager
            }),
            
            ocean: new IvSelect(document.querySelector('#demo-ocean'), {
                theme: 'ocean',
                placeholder: 'تم اقیانوس...',
                themeManager: IvSelectThemeManager
            }),
            
            midnight: new IvSelect(document.querySelector('#demo-midnight'), {
                theme: 'midnight',
                placeholder: 'تم نیمه‌شب...',
                themeManager: IvSelectThemeManager
            }),
            
            forest: new IvSelect(document.querySelector('#demo-forest'), {
                theme: 'forest',
                placeholder: 'تم جنگل...',
                themeManager: IvSelectThemeManager
            })
        };
        
        console.log('✅ همه نمونه‌ها با موفقیت ساخته شدند!', instances);
    </script>

    <style>
        /* فقط برای چیدمان دمو - هیچ استایلی روی سلکت‌ها اعمال نمی‌شه */
        body {
            font-family: system-ui, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        select {
            width: 100%;
        }
    </style>
</body>
</html>
