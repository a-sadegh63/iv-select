<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Filter - دمو</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
            background: #fafafa;
        }

        h1 { color: #0f172a; }
        
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
    </style>
</head>
<body>
    <h1>📊 Excel Filter</h1>
    
    <table id="products-table">
        <thead>
            <tr>
                <th>شناسه</th>
                <th>نام محصول</th>
                <th>دسته‌بندی</th>
                <th>قیمت</th>
                <th>موجودی</th>
                <th>وضعیت</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>1</td><td>لپ‌تاپ ایسوس</td><td>الکترونیک</td><td>15,000,000</td><td>12</td><td>موجود</td></tr>
            <tr><td>2</td><td>موبایل سامسونگ</td><td>الکترونیک</td><td>12,000,000</td><td>8</td><td>موجود</td></tr>
            <tr><td>3</td><td>هدفون بیسیم</td><td>الکترونیک</td><td>2,500,000</td><td>0</td><td>ناموجود</td></tr>
            <tr><td>4</td><td>میز اداری</td><td>مبلمان</td><td>3,200,000</td><td>5</td><td>موجود</td></tr>
            <tr><td>5</td><td>صندلی گیمینگ</td><td>مبلمان</td><td>4,500,000</td><td>3</td><td>موجود</td></tr>
        </tbody>
    </table>

    <div class="controls">
        <button id="btn-clear" class="btn btn-danger">🧹 پاک کردن فیلترها</button>
        <button id="btn-theme-light" class="btn btn-primary">🌞 روشن</button>
        <button id="btn-theme-dark" class="btn btn-primary">🌙 تیره</button>
    </div>

    <script type="module">
        import IvSelectThemeManager from '../iv-select.themes.js';
        import { ExcelFilter } from '../excel-filter.js';

        let filter;

        function initFilter(theme) {
            if (filter) filter.destroy();
            filter = new ExcelFilter(document.querySelector('#products-table'), {
                theme: theme,
                themeManager: IvSelectThemeManager
            });
        }

        initFilter('light');

        document.getElementById('btn-clear').onclick = () => filter.clearAllFilters();
        document.getElementById('btn-theme-light').onclick = () => initFilter('light');
        document.getElementById('btn-theme-dark').onclick = () => initFilter('dark');
    </script>
</body>
</html>
